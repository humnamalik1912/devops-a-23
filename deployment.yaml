apiVersion: apps/v1
kind: Deployment
metadata:
  name: seta-seat-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: seta-seat
  template:
    metadata:
      labels:
        app: seta-seat
    spec:
      containers:
        - name: seta-seat-container
          image: seta-seat:latest
          ports:
            - containerPort: 80
          imagePullPolicy: IfNotPresent
---
apiVersion: v1
kind: Service
metadata:
  name: seta-seat-service
spec:
  selector:
    app: seta-seat
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
